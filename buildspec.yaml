version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 18

  pre_build:
    commands:
      - echo Installing root dependencies
      - npm install
      - echo Installing frontend dependencies
      - cd frontend && npm install && cd ..

  build:
    commands:
      - echo Building frontend
      - cd frontend && npm run build && cd ..

artifacts:
  files:
    - '**/*'
  exclude-paths:
    - node_modules/**
    - frontend/node_modules/**